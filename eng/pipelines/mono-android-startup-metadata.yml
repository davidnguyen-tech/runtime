{
  "trigger": "none",
  "pr": "none",
  "parameters": [
    { "name": "enableProducer", "type": "boolean", "default": false },
    { "name": "sourceCommit", "type": "string", "default": "" },
    { "name": "containerImage", "type": "string", "default": "" },
    { "name": "ndkRoot", "type": "string", "default": "" },
    { "name": "ndkRevision", "type": "string", "default": "" }
  ],
  "stages": [
    {
      "${{ if eq(parameters.enableProducer, false) }}": [
        {
          "stage": "ProducerDisabled",
          "displayName": "Diagnostic producer remains disabled",
          "jobs": [
            {
              "job": "DisabledGuard",
              "pool": { "vmImage": "ubuntu-22.04" },
              "steps": [
                { "checkout": "none" },
                { "bash": "printf '%s\\n' 'Diagnostic producer is disabled; no build or package action.'",
                  "displayName": "Report disabled state" }
              ]
            }
          ]
        }
      ]
    },
    {
      "${{ if eq(parameters.enableProducer, true) }}": [
        {
          "stage": "DiagnosticArtifacts",
          "displayName": "Unsigned unadmitted Mono Android diagnostics",
          "condition": "and(succeeded(), eq(variables['Build.Reason'], 'Manual'))",
          "jobs": [
            {
              "job": "ValidateInputs",
              "pool": { "vmImage": "ubuntu-22.04" },
              "steps": [
                { "checkout": "self", "fetchDepth": 0, "persistCredentials": false },
                {
                  "bash": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$REVIEWED_SOURCE\"\npython3 eng/diagnostics/produce-mono-android-startup.py --enable --plan-only --source \"$REVIEWED_SOURCE\" --run-id \"$BUILD_BUILDID.$SYSTEM_JOBATTEMPT\" --container \"$REVIEWED_CONTAINER\"\n",
                  "displayName": "Validate immutable image before starting its container",
                  "env": {
                    "REVIEWED_SOURCE": "${{ parameters.sourceCommit }}",
                    "REVIEWED_CONTAINER": "${{ parameters.containerImage }}"
                  }
                }
              ]
            },
            {
              "job": "NormalRuntimePacks",
              "dependsOn": "ValidateInputs",
              "timeoutInMinutes": 180,
              "pool": { "vmImage": "ubuntu-22.04" },
              "container": "${{ parameters.containerImage }}",
              "steps": [
                {
                  "checkout": "self",
                  "clean": true,
                  "fetchDepth": 0,
                  "persistCredentials": false
                },
                {
                  "bash": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$REVIEWED_SOURCE\"\npython3 eng/diagnostics/produce-mono-android-startup.py --enable --source \"$REVIEWED_SOURCE\" --run-id \"$BUILD_BUILDID.$SYSTEM_JOBATTEMPT\" --container \"$REVIEWED_CONTAINER\" --ndk \"$REVIEWED_NDK\" --ndk-revision \"$REVIEWED_NDK_REVISION\"\n",
                  "displayName": "Build normal packs and retain nonpromotion receipts",
                  "env": {
                    "REVIEWED_SOURCE": "${{ parameters.sourceCommit }}",
                    "REVIEWED_CONTAINER": "${{ parameters.containerImage }}",
                    "REVIEWED_NDK": "${{ parameters.ndkRoot }}",
                    "REVIEWED_NDK_REVISION": "${{ parameters.ndkRevision }}"
                  }
                },
                {
                  "task": "PublishPipelineArtifact@1",
                  "displayName": "Retain diagnostics artifacts only",
                  "condition": "succeededOrFailed()",
                  "inputs": {
                    "targetPath": "$(Build.SourcesDirectory)/artifacts/startup-metadata-producer",
                    "artifact": "mono-android-startup-unsigned-unadmitted"
                  }
                }
              ]
            }
          ]
        }
      ]
    }
  ]
}
