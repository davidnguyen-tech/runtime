parameters:
  - name: templatePath
    type: string
  - name: stages
    type: stageList
  - name: containers
    type: object
  - name: enableMonoStartupMetadata
    type: boolean
    default: false

extends:
  template: ${{ parameters.templatePath }}
  parameters:
    stages: ${{ parameters.stages }}
    containers: ${{ parameters.containers }}
    ${{ if and(eq(parameters.templatePath, 'template1es.yml'), parameters.enableMonoStartupMetadata) }}:
      enableMonoStartupMetadata: true
      oneESTemplateRef: 8bb89477eb3e61becfe1ab21442fe9aefb031b35