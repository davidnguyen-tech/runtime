

parameters:
  - name: templatePath
    type: string
    default: 'templates-official'
  - name: stages
    type: stageList
  - name: containers
    type: object
  - name: enableMonoStartupMetadata
    type: boolean
    default: false
  - name: oneESTemplateRef
    type: string
    default: refs/tags/release
    values:
      - refs/tags/release
      - 8bb89477eb3e61becfe1ab21442fe9aefb031b35


resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: ${{ parameters.oneESTemplateRef }}

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      ${{ if parameters.enableMonoStartupMetadata }}:
        sourceRepositoriesToScan:
          include:
          - repository: 1ESPipelineTemplates
      codeql:
        compiled:
          enabled: false
          justificationForDisabling: 'CodeQL is run manually on the runtime-codeql pipeline'
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/.config/CredScanSuppressions.json
      policheck:
        enabled: true
      tsa:
        enabled: true
    pool:
      name: $(DncEngInternalBuildPool)
      image: 1es-windows-2022
      os: windows

    containers:
      ${{ parameters.containers }}

    stages: ${{ parameters.stages }}
