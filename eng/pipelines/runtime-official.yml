trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
    - internal/release/*
  paths:
    include:
    - '*'
    exclude:
    - '**.md'
    - .devcontainer/*
    - .github/*
    - docs/*
    - LICENSE.TXT
    - PATENTS.TXT
    - THIRD-PARTY-NOTICES.TXT

# This is an official pipeline that should not be triggerable from a PR,
# there is no public pipeline associated with it.
pr: none

parameters:
- name: enableMonoStartupMetadata
  displayName: Build and sign artifact-only Mono Android startup diagnostics
  type: boolean
  default: false
- name: monoStartupRealSign
  displayName: Use approved Real signing instead of Test signing (manual diagnostic only)
  type: boolean
  default: false
- name: monoStartupSourceCommit
  displayName: Exact reviewed diagnostic feature commit (required when enabled)
  type: string
  default: ''
- name: monoStartupAttempt
  displayName: Common diagnostic experiment attempt (not a job retry number)
  type: number
  default: 1

variables:
- template: /eng/pipelines/common/variables.yml
  parameters:
    templatePath: 'templates-official'
- template: /eng/pipelines/common/internal-variables.yml
  parameters:
    teamName: dotnet-core-acquisition

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    isOfficialBuild: true
    enableMonoStartupMetadata: ${{ parameters.enableMonoStartupMetadata }}
    stages:
    - ${{ if eq(parameters.enableMonoStartupMetadata, true) }}:
      - template: /eng/pipelines/mono-android-startup-metadata.yml
        parameters:
          sourceCommit: ${{ parameters.monoStartupSourceCommit }}
          attempt: ${{ parameters.monoStartupAttempt }}
          realSign: ${{ parameters.monoStartupRealSign }}
    - ${{ if eq(parameters.enableMonoStartupMetadata, false) }}:
      - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
        - stage: Localization
          dependsOn: []
          jobs:
          #
          # Localization build
          #
          - template: /eng/common/templates-official/job/onelocbuild.yml
            parameters:
              MirrorRepo: runtime
              MirrorBranch: main
              LclSource: lclFilesfromPackage
              LclPackageId: 'LCL-JUNO-PROD-RUNTIME'
        - stage: Source_Index
          dependsOn: []
          displayName: Source Index
          jobs:
          #
          # Source Index Build
          #
            - template: /eng/common/templates-official/job/source-index-stage1.yml
              parameters:
                sourceIndexBuildCommand: build.cmd -subset libs.sfx+libs.oob -binarylog -os linux -ci /p:SkipLibrariesNativeRuntimePackages=true

      - stage: Publish
        dependsOn: []
        jobs:
        - template: /eng/common/templates-official/job/publish-build-assets.yml
          parameters:
            publishUsingPipelines: true
            publishAssetsImmediately: true
            isAssetlessBuild: true
            pool:
              name: $(DncEngInternalBuildPool)
              demands: ImageOverride -equals 1es-windows-2022
