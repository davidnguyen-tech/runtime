parameters:
- name: runPrivateJobs
  type: boolean
  default: false
- name: runScheduledJobs
  type: boolean
  default: false
- name: onlySanityCheck
  type: boolean
  default: false
- name: externalRuntimeMode
  type: boolean
  default: false
# Definition 1012 supports only the complete external-runtime matrix. It intentionally
# does not expose externalRuntimeScope, so Runs API requests for an x64 scope are rejected.
- name: externalRuntimeContractVersion
  type: string
  default: ''
- name: externalRuntimeCoverageRowsSha256
  type: string
  default: ''
- name: externalRuntimeProducerDefinitionId
  type: number
  default: 0
- name: externalRuntimeProducerBuildId
  type: number
  default: 0
- name: externalRuntimeProducerBuildNumber
  type: string
  default: ''
- name: externalRuntimeSourceRepository
  type: string
  default: ''
- name: externalRuntimeSourceBranch
  type: string
  default: ''
- name: externalRuntimeSourceCommit
  type: string
  default: ''
- name: externalRuntimeCampaignId
  type: string
  default: ''
- name: externalRuntimeCohortId
  type: string
  default: ''
- name: externalRuntimeCohortManifestSha256
  type: string
  default: ''
- name: externalRuntimeArtifactMapJson
  type: string
  default: '{"schemaVersion":1,"entries":[]}'
- name: externalRuntimeSkipPerfLabUpload
  type: boolean
  default: true
- name: externalRuntimeIdempotencyKey
  type: string
  default: ''
- name: externalRuntimeAttempt
  type: number
  default: 1

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*.0
  paths:
    include:
    - '*'
    exclude:
    - '**.md'
    - .devcontainer/*
    - .github/*
    - docs/*
    - LICENSE.TXT
    - PATENTS.TXT
    - THIRD-PARTY-NOTICES.TXT

resources:
  repositories:
    - repository: performance
      type: git
      name: internal/dotnet-performance
      # Restore the merged/default performance ref before merging this runtime branch.
      ref: 2f655d738d9aff0a0cb440ba5967cde19c8d4ad3

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true

schedules:
- cron: "30 2 * * *"
  displayName: Every night at 2:30AM
  branches:
    include:
    - main
  always: true

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - stage: Build
      variables:
      # The standalone monitor does not inherit the submitter jobs' variable groups.
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - group: DotNet-HelixApi-Access
      jobs:
      - template: /eng/common/core-templates/job/helix-job-monitor.yml
        parameters:
          helixAccessToken: $(HelixApiAccessToken)
          timeoutInMinutes: 540
          allowNoHelixJobs: true

      - ${{ if ne(variables['System.TeamProject'], 'public') }}:
        - template: /eng/pipelines/runtime-slow-perf-jobs.yml@performance
          parameters:
            ${{ if or(in(variables['Build.Reason'], 'Schedule'), parameters.runScheduledJobs) }}:
              runScheduledJobs: true
            ${{ if or(notin(variables['Build.Reason'], 'Schedule', 'Manual'), parameters.runPrivateJobs) }}:
              runPrivateJobs: true
            runtimeRepoAlias: self
            performanceRepoAlias: performance
            ${{ if eq(parameters.externalRuntimeMode, true) }}:
              externalRuntimeMode: true
              externalRuntime:
                contractVersion: ${{ parameters.externalRuntimeContractVersion }}
                coverageRowsSha256: ${{ parameters.externalRuntimeCoverageRowsSha256 }}
                producerDefinitionId: ${{ parameters.externalRuntimeProducerDefinitionId }}
                producerBuildId: ${{ parameters.externalRuntimeProducerBuildId }}
                producerBuildNumber: ${{ parameters.externalRuntimeProducerBuildNumber }}
                sourceRepository: ${{ parameters.externalRuntimeSourceRepository }}
                sourceBranch: ${{ parameters.externalRuntimeSourceBranch }}
                sourceCommit: ${{ parameters.externalRuntimeSourceCommit }}
                campaignId: ${{ parameters.externalRuntimeCampaignId }}
                cohortId: ${{ parameters.externalRuntimeCohortId }}
                cohortManifestSha256: ${{ parameters.externalRuntimeCohortManifestSha256 }}
                artifactMapJson: ${{ parameters.externalRuntimeArtifactMapJson }}
                skipPerfLabUpload: ${{ parameters.externalRuntimeSkipPerfLabUpload }}
                idempotencyKey: ${{ parameters.externalRuntimeIdempotencyKey }}
                attempt: ${{ parameters.externalRuntimeAttempt }}
            jobParameters:
              ${{ if parameters.onlySanityCheck }}:
                onlySanityCheck: true
