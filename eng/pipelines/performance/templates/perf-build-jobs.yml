parameters:
  perfBranch: 'main' # Currently only used for building the BDN App
  externalRuntimeMode: false
  externalRuntime: {}

jobs:
  # build coreclr and libraries
  - template: /eng/pipelines/performance/templates/perf-coreclr-build-jobs.yml
    parameters:
      linux_x64: true
      linux_arm64: true
      windows_x64: true
      windows_x86: true
      android_arm64: true
      coreclr_r2r_interpreter: true
      externalRuntimeMode: ${{ parameters.externalRuntimeMode }}
      externalRuntime: ${{ parameters.externalRuntime }}

  # build mono for AOT
  - template: /eng/pipelines/performance/templates/perf-mono-build-jobs.yml
    parameters:
      mono_x64: true
      monoAot_x64: true
